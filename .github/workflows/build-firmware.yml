name: build-firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  pull_request:

# Build the universal firmware plus both swappable brain packs and the IR
# library, then publish a merged flashable image + esp-web-tools manifest so the
# web page can flash without a toolchain. Secrets are NEVER involved: the fox is
# configured over USB after flashing.
jobs:
  data:
    runs-on: ubuntu-latest
    outputs:
      ir_sha: ${{ steps.ir.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy
        run: pip install "numpy>=1.26"

      - name: Build IR library (FOXI)
        id: ir
        run: |
          python tools/build_ir.py \
            --out firmware/main/data/fox_ir.bin \
            --tv     assets/ir/tv.ir \
            --audio  assets/ir/audio.ir \
            --projector assets/ir/projector.ir \
            --ac     assets/ir/ac.ir
          echo "sha=$(sha256sum firmware/main/data/fox_ir.bin | cut -c1-16)" >> $GITHUB_OUTPUT

      - name: Train brain packs (FOXB) — CPU numpy, no torch
        run: |
          python tools/train_brain.py --pack A --out firmware/main/data/foxbrainA.bin --steps 6000
          python tools/train_brain.py --pack B --out firmware/main/data/foxbrainB.bin --steps 5000

      - uses: actions/upload-artifact@v4
        with:
          name: fox-data
          path: firmware/main/data/*.bin

  firmware:
    needs: data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fox-data
          path: firmware/main/data

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.2
          target: esp32s3
          path: firmware

      - name: Assemble flashable images
        run: |
          mkdir -p dist
          cd firmware/build
          # Core app + bootloader + partition table.
          cp bootloader/bootloader.bin partition_table/partition-table.bin fox.bin ../../dist/
          # Data partitions the web tool flashes at their partition offsets.
          cp ../main/data/fox_ir.bin      ../../dist/foxdata.bin
          cp ../main/data/foxbrainA.bin   ../../dist/foxbrainA.bin
          cp ../main/data/foxbrainB.bin   ../../dist/foxbrainB.bin
          cd ../../dist
          sha256sum * > SHA256SUMS

      - name: Emit esp-web-tools manifest
        run: |
          cat > dist/manifest.json <<'JSON'
          {
            "name": "Fox Voice Companion",
            "version": "1.0.0",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [
                  { "path": "bootloader.bin",        "offset": 0 },
                  { "path": "partition-table.bin",   "offset": 32768 },
                  { "path": "fox.bin",               "offset": 131072 },
                  { "path": "foxbrainA.bin",         "offset": 6946816 },
                  { "path": "foxdata.bin",           "offset": 7733248 }
                ]
              }
            ]
          }
          JSON
          # Pack B manifest: identical except the foxbrain part points at pack B.
          cat > dist/manifest-b.json <<'JSON'
          {
            "name": "Fox Voice Companion (Critter brain)",
            "version": "1.0.0",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [
                  { "path": "bootloader.bin",        "offset": 0 },
                  { "path": "partition-table.bin",   "offset": 32768 },
                  { "path": "fox.bin",               "offset": 131072 },
                  { "path": "foxbrainB.bin",         "offset": 6946816 },
                  { "path": "foxdata.bin",           "offset": 7733248 }
                ]
              }
            ]
          }
          JSON

      - uses: actions/upload-artifact@v4
        with:
          name: fox-firmware
          path: dist/

      - name: Publish to Pages (web flasher + firmware)
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p site
          cp -r web/* site/
          cp -r dist site/firmware
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  deploy-pages:
    if: github.ref == 'refs/heads/main'
    needs: firmware
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
