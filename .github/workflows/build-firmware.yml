name: build-firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  pull_request:

# Pages deploy needs these; concurrency avoids overlapping deploys.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

# Build the universal firmware plus both swappable brain packs and the IR
# library, then publish a merged flashable image + esp-web-tools manifest so the
# web page can flash without a toolchain. Secrets are NEVER involved: the fox is
# configured over USB after flashing.
jobs:
  data:
    runs-on: ubuntu-latest
    outputs:
      ir_sha: ${{ steps.ir.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Locate sources (self-healing bootstrap)
        run: |
          # Make the build work no matter how the project got into the repo:
          #  (a) a dropped project *.zip at root  -> expand it
          #  (b) files committed inside a wrapper folder (Atoms3_assistant/...,
          #      the usual result of Windows "Extract All") -> hoist to root
          #  (c) already flat at root -> no-op
          set -e
          zip=$(ls -t *.zip 2>/dev/null | head -1 || true)
          if [ -n "$zip" ]; then
            echo "Expanding $zip"
            tmp=$(mktemp -d); unzip -oq "$zip" -d "$tmp"
            entries=$(ls -A "$tmp")
            if [ "$(echo "$entries" | wc -l)" -eq 1 ] && [ -d "$tmp/$entries" ]; then
              src="$tmp/$entries"; else src="$tmp"; fi
            cp -a "$src"/. ./ 2>/dev/null || (cd "$src" && tar cf - . | (cd "$OLDPWD" && tar xf -))
            rm -rf "$tmp"
          fi
          if [ ! -f tools/build_ir.py ]; then
            # look for the project in a subfolder and hoist it up to root
            found=$(find . -name build_ir.py -path '*/tools/build_ir.py' | head -1 || true)
            if [ -n "$found" ]; then
              root=$(dirname "$(dirname "$found")")
              echo "Hoisting project from '$root' to repo root"
              cp -a "$root"/. ./ 2>/dev/null || (cd "$root" && tar cf - --exclude=.git . | (cd "$GITHUB_WORKSPACE" && tar xf -))
            fi
          fi
          if [ ! -f tools/build_ir.py ]; then
            echo "::error::tools/build_ir.py not found anywhere. Commit the project so that tools/, firmware/, web/ sit at the repo ROOT (not inside a subfolder), or drop the project .zip at the root."
            echo "Repo tree for debugging:"; find . -maxdepth 2 -not -path './.git/*' | sort
            exit 1
          fi
          echo "Sources located. Root contents:"; ls
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy
        run: pip install "numpy>=1.26"

      - name: Build IR library (FOXI)
        id: ir
        run: |
          python tools/build_ir.py \
            --out firmware/main/data/fox_ir.bin \
            --tv     assets/ir/tv.ir \
            --audio  assets/ir/audio.ir \
            --projector assets/ir/projector.ir \
            --ac     assets/ir/ac.ir
          echo "sha=$(sha256sum firmware/main/data/fox_ir.bin | cut -c1-16)" >> $GITHUB_OUTPUT

      - name: Train brain packs (FOXB) — CPU numpy, no torch
        run: |
          python tools/train_brain.py --pack A --out firmware/main/data/foxbrainA.bin --steps 6000
          python tools/train_brain.py --pack B --out firmware/main/data/foxbrainB.bin --steps 5000

      - uses: actions/upload-artifact@v4
        with:
          name: fox-data
          path: firmware/main/data/*.bin

  firmware:
    needs: data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate sources (self-healing bootstrap)
        run: |
          set -e
          zip=$(ls -t *.zip 2>/dev/null | head -1 || true)
          if [ -n "$zip" ]; then
            tmp=$(mktemp -d); unzip -oq "$zip" -d "$tmp"
            entries=$(ls -A "$tmp")
            if [ "$(echo "$entries" | wc -l)" -eq 1 ] && [ -d "$tmp/$entries" ]; then
              src="$tmp/$entries"; else src="$tmp"; fi
            cp -a "$src"/. ./ 2>/dev/null || (cd "$src" && tar cf - . | (cd "$OLDPWD" && tar xf -))
            rm -rf "$tmp"
          fi
          if [ ! -f firmware/CMakeLists.txt ]; then
            found=$(find . -name CMakeLists.txt -path '*/firmware/CMakeLists.txt' | head -1 || true)
            if [ -n "$found" ]; then
              root=$(dirname "$(dirname "$found")")
              cp -a "$root"/. ./ 2>/dev/null || (cd "$root" && tar cf - --exclude=.git . | (cd "$GITHUB_WORKSPACE" && tar xf -))
            fi
          fi
          if [ ! -f firmware/CMakeLists.txt ]; then
            echo "::error::firmware/ not found at repo root."; find . -maxdepth 2 -not -path './.git/*' | sort; exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: fox-data
          path: firmware/main/data

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.2
          target: esp32s3
          path: firmware

      - name: Assemble flashable images (authoritative offsets from IDF)
        run: |
          set -e
          mkdir -p dist
          cd firmware/build
          # flasher_args.json is IDF's own source of truth: exact file->offset
          # for bootloader, partition-table, app, AND the esp-sr model image.
          echo "flasher_args.json flash_files:"
          python3 - <<'PY'
          import json
          d=json.load(open("flasher_args.json"))
          for off,f in sorted(d["flash_files"].items(), key=lambda x:int(x[0],16)):
              print(f"  {off}  {f}")
          PY
          # Copy the standard images.
          cp bootloader/bootloader.bin partition_table/partition-table.bin fox.bin ../../dist/
          cp ../main/data/fox_ir.bin    ../../dist/foxdata.bin
          cp ../main/data/foxbrainA.bin ../../dist/foxbrainA.bin
          cp ../main/data/foxbrainB.bin ../../dist/foxbrainB.bin
          # The esp-sr model image: take its path+offset straight from IDF.
          model_path=$(python3 -c "import json;d=json.load(open('flasher_args.json'));print([f for o,f in d['flash_files'].items() if 'srmodels' in f or 'model' in f.lower()][0])")
          echo "model image path (from IDF): $model_path"
          cp "$model_path" ../../dist/srmodels.bin
          test -s ../../dist/srmodels.bin || { echo "::error::srmodels.bin is empty/missing — offline speech would brick a web flash. Failing build."; exit 1; }
          echo "srmodels.bin size: $(stat -c%s ../../dist/srmodels.bin) bytes"
          # Export the exact offsets IDF used, so the manifest can't drift from
          # the partition table.
          python3 - <<'PY' > offsets.env
          import json
          d=json.load(open("flasher_args.json"))
          def off_for(sub):
              for o,f in d["flash_files"].items():
                  if sub in f: return int(o,16)
              return None
          app=off_for("fox.bin"); model=off_for("srmodels")
          print(f"APP_OFFSET={app}")
          print(f"MODEL_OFFSET={model}")
          PY
          cat offsets.env
          cp offsets.env ../../dist/offsets.env
          cd ../../dist
          sha256sum * > SHA256SUMS

      - name: Emit esp-web-tools manifests (offsets from IDF, brain from partition table)
        run: |
          set -e
          cd dist
          . offsets.env
          # foxbrain/foxdata offsets come from partitions.csv (data partitions IDF
          # doesn't flash): keep these two in sync with partitions.csv.
          FOXBRAIN_OFFSET=$((16#6c0000))
          FOXDATA_OFFSET=$((16#7a0000))
          gen() {  # $1 = brain bin, $2 = out manifest
            cat > "$2" <<JSON
          {
            "name": "Fox Voice Companion",
            "version": "1.0.0",
            "new_install_prompt_erase": true,
            "builds": [{
              "chipFamily": "ESP32-S3",
              "parts": [
                { "path": "bootloader.bin",      "offset": 0 },
                { "path": "partition-table.bin", "offset": 32768 },
                { "path": "fox.bin",             "offset": ${APP_OFFSET} },
                { "path": "srmodels.bin",        "offset": ${MODEL_OFFSET} },
                { "path": "$1",                  "offset": ${FOXBRAIN_OFFSET} },
                { "path": "foxdata.bin",         "offset": ${FOXDATA_OFFSET} }
              ]
            }]
          }
          JSON
          }
          gen foxbrainA.bin manifest.json
          gen foxbrainB.bin manifest-b.json
          echo "=== manifest.json ==="; cat manifest.json
          echo "=== offsets used: app=$APP_OFFSET model=$MODEL_OFFSET brain=$FOXBRAIN_OFFSET foxdata=$FOXDATA_OFFSET ==="

      - uses: actions/upload-artifact@v4
        with:
          name: fox-firmware
          path: dist/

      - name: Publish to Pages (web flasher + firmware)
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p site
          cp -r web/* site/
          cp -r dist site/firmware
          # index.html (the flasher) is now the site root. .nojekyll stops
          # GitHub from running Jekyll on it (which can hide files/underscores).
          touch site/.nojekyll
          echo "Site root contents:"; ls -la site
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  deploy-pages:
    if: github.ref == 'refs/heads/main'
    needs: firmware
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
