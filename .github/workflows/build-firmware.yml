name: build-firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build IR data
        run: |
          python3 tools/build_ir.py
          test -f firmware/main/data/fox_ir.bin

      - name: Build brain packs
        run: |
          python3 tools/train_brain.py --pack A --out firmware/main/data/foxbrainA.bin
          python3 tools/train_brain.py --pack B --out firmware/main/data/foxbrainB.bin
          test -f firmware/main/data/foxbrainA.bin
          test -f firmware/main/data/foxbrainB.bin

      - name: Upload data artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fox-data
          path: |
            firmware/main/data/fox_ir.bin
            firmware/main/data/foxbrainA.bin
            firmware/main/data/foxbrainB.bin

  firmware:
    needs: data
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download data artifacts
        uses: actions/download-artifact@v4
        with:
          name: fox-data
          path: firmware/main/data

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.2
          target: esp32s3
          path: firmware

      - name: Assemble firmware package
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          cd firmware/build

          cp bootloader/bootloader.bin ../../dist/bootloader.bin
          cp partition_table/partition-table.bin ../../dist/partition-table.bin
          cp fox.bin ../../dist/fox.bin

          cd ../main/data

          cp fox_ir.bin ../../../../dist/foxdata.bin
          cp foxbrainA.bin ../../../../dist/foxbrainA.bin
          cp foxbrainB.bin ../../../../dist/foxbrainB.bin

          cd ../../../..

          # ESP-SR model image generated by the ESP-SR component.
          model="$(find firmware/build -type f -name 'srmodels.bin' -print -quit)"

          if [ -z "$model" ]; then
            echo "::error::srmodels.bin was not generated by ESP-SR"
            exit 1
          fi

          model_size="$(stat -c%s "$model")"
          model_partition_size=$((0x260000))

          echo "ESP-SR model: $model"
          echo "ESP-SR model size: $model_size bytes"
          echo "model partition size: $model_partition_size bytes"

          if [ "$model_size" -gt "$model_partition_size" ]; then
            echo "::error::srmodels.bin is larger than the model partition"
            exit 1
          fi

          cp "$model" dist/srmodels.bin

          sha256sum dist/* > dist/SHA256SUMS

      - name: Generate web-flasher manifest
        shell: python
        run: |
          import json
          from pathlib import Path

          # These offsets come directly from firmware/partitions.csv.
          # Do not independently change them in this workflow.
          parts = [
              {"path": "bootloader.bin",     "offset": 0},
              {"path": "partition-table.bin","offset": 32768},
              {"path": "fox.bin",            "offset": 131072},
              {"path": "srmodels.bin",       "offset": 3080192},
              {"path": "foxbrainA.bin",      "offset": 6488064},
              {"path": "foxdata.bin",        "offset": 7536640},
          ]

          manifest = {
              "name": "Fox Voice Assistant",
              "version": "latest",
              "parts": parts,
          }

          Path("dist/manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8"
          )

          manifest_b = dict(manifest)
          manifest_b["parts"] = [
              dict(p, path=p["path"].replace("foxbrainA", "foxbrainB"))
              for p in parts
          ]

          Path("dist/manifest-B.json").write_text(
              json.dumps(manifest_b, indent=2) + "\n",
              encoding="utf-8"
          )

      - name: Prepare Pages site
        shell: bash
        run: |
          set -euo pipefail

          rm -rf site
          mkdir -p site

          cp web/index.html site/index.html
          cp dist/*.bin site/
          cp dist/*.json site/
          cp dist/SHA256SUMS site/

          touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: firmware
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
