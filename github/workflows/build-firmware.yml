name: build-firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate sources (self-healing bootstrap)
        run: |
          set -e
          zip=$(ls -t *.zip 2>/dev/null | head -1 || true)
          if [ -n "$zip" ]; then
            echo "Expanding $zip"
            tmp=$(mktemp -d); unzip -oq "$zip" -d "$tmp"
            entries=$(ls -A "$tmp")
            if [ "$(echo "$entries" | wc -l)" -eq 1 ] && [ -d "$tmp/$entries" ]; then
              src="$tmp/$entries"; else src="$tmp"; fi
            cp -a "$src"/. ./ 2>/dev/null || (cd "$src" && tar cf - . | (cd "$OLDPWD" && tar xf -))
            rm -rf "$tmp"
          fi
          if [ ! -f tools/train_brain.py ]; then
            found=$(find . -name train_brain.py -path '*/tools/train_brain.py' | head -1 || true)
            if [ -n "$found" ]; then
              root=$(dirname "$(dirname "$found")")
              cp -a "$root"/. ./ 2>/dev/null || (cd "$root" && tar cf - --exclude=.git . | (cd "$GITHUB_WORKSPACE" && tar xf -))
            fi
          fi
          test -f tools/train_brain.py || { echo "::error::tools/train_brain.py not found"; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy
        run: pip install "numpy>=1.26"
      - name: Train brain packs (FOXB) — CPU numpy, no torch
        run: |
          # Brain v2: learns the conversation policy (style/gesture/intensity/
          # next-move). ~65s per pack on one core; prints policy agreement.
          python tools/train_brain.py --pack A --out firmware/main/data/foxbrainA.bin --steps 9000
          python tools/train_brain.py --pack B --out firmware/main/data/foxbrainB.bin --steps 9000
          # The firmware's no-model fallback uses the SAME policy as a C table
          # (committed as firmware/main/brain_policy.h). Fail if they drift.
          python tools/train_brain.py --emit-policy /tmp/brain_policy.h
          diff -q /tmp/brain_policy.h firmware/main/brain_policy.h || { echo "::error::brain_policy.h is stale: run tools/train_brain.py --emit-policy firmware/main/brain_policy.h"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: fox-data
          path: firmware/main/data/*.bin

  firmware:
    needs: data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate sources (self-healing bootstrap)
        run: |
          set -e
          zip=$(ls -t *.zip 2>/dev/null | head -1 || true)
          if [ -n "$zip" ]; then
            tmp=$(mktemp -d); unzip -oq "$zip" -d "$tmp"
            entries=$(ls -A "$tmp")
            if [ "$(echo "$entries" | wc -l)" -eq 1 ] && [ -d "$tmp/$entries" ]; then
              src="$tmp/$entries"; else src="$tmp"; fi
            cp -a "$src"/. ./ 2>/dev/null || (cd "$src" && tar cf - . | (cd "$OLDPWD" && tar xf -))
            rm -rf "$tmp"
          fi
          test -f firmware/CMakeLists.txt || { echo "::error::firmware/ not found at repo root"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: fox-data
          path: firmware/main/data

      - name: Precompute MultiNet phonemes (Espressif's recommended g2p)
        continue-on-error: true      # on failure the committed empty table = runtime G2P
        run: |
          python3 -m pip install --quiet g2p_en nltk
          python3 tools/gen_mn_phonemes.py
          grep -c '^    {"' firmware/main/mn_phonemes.h || true
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.2
          target: esp32s3
          path: firmware

     
      - name: Assemble images + web-flash manifests (offsets from IDF)
        run: |
          set -e
          mkdir -p dist
          FA=firmware/build/flasher_args.json
          cp firmware/build/bootloader/bootloader.bin dist/
          cp firmware/build/partition_table/partition-table.bin dist/
          cp firmware/build/fox.bin dist/
          cp firmware/main/data/foxbrainA.bin dist/foxbrainA.bin
          cp firmware/main/data/foxbrainB.bin dist/foxbrainB.bin
          APP_OFFSET=$(python3 -c "import json;d=json.load(open('$FA'));print(int([o for o,f in d['flash_files'].items() if f.endswith('fox.bin')][0],16))")
          MODEL_REL=$(python3 -c "import json;d=json.load(open('$FA'));print([f for o,f in d['flash_files'].items() if 'srmodels' in f][0])")
          MODEL_OFFSET=$(python3 -c "import json;d=json.load(open('$FA'));print(int([o for o,f in d['flash_files'].items() if 'srmodels' in f][0],16))")
          cp "firmware/build/$MODEL_REL" dist/srmodels.bin
          test -s dist/srmodels.bin

          python3 - <<'PY'
          import csv, json, os
          parts={}
          for row in csv.reader(open('firmware/partitions.csv')):
              row=[c.strip() for c in row if c.strip()]
              if row and not row[0].startswith('#'):
                  parts[row[0]]=(int(row[3],16),int(row[4],16))
          rows=sorted((off,off+size,name) for name,(off,size) in parts.items())
          for a,b in zip(rows,rows[1:]):
              assert a[1] <= b[0], f'partition overlap: {a} -> {b}'
          assert rows[-1][1] <= 0x800000, hex(rows[-1][1])
          sizes={name:size for name,(off,size) in parts.items()}
          expected={
              'model': os.path.getsize('dist/srmodels.bin'),
              'foxbrainA.bin': os.path.getsize('firmware/main/data/foxbrainA.bin'),
              'foxbrainB.bin': os.path.getsize('firmware/main/data/foxbrainB.bin'),
          }
          for name,n in expected.items():
              limit=sizes['model'] if name=='model' else sizes['foxbrain']
              assert n <= limit, f'{name} ({n}) exceeds partition ({limit})'
          print('partition validation: OK')
          print('factory bytes:', sizes['factory'])
          print('model bytes:', sizes['model'], 'actual:', expected['model'])
          print('PicoTA bytes:', sizes['picotts_ta'], 'PicoSG bytes:', sizes['picotts_sg'])
          print('brain bytes:', sizes['foxbrain'], 'A:', expected['foxbrainA.bin'], 'B:', expected['foxbrainB.bin'])
          print('flash end:', hex(rows[-1][1]))
          PY

          FOXBRAIN_OFFSET=$(python3 -c "import csv; print(next(int(r[3],16) for r in csv.reader(open('firmware/partitions.csv')) if r and r[0].strip()=='foxbrain'))")
          PICO_TA_OFFSET=$(python3 -c "import csv; print(next(int(r[3],16) for r in csv.reader(open('firmware/partitions.csv')) if r and r[0].strip()=='picotts_ta'))")
          PICO_SG_OFFSET=$(python3 -c "import csv; print(next(int(r[3],16) for r in csv.reader(open('firmware/partitions.csv')) if r and r[0].strip()=='picotts_sg'))")
          # PicoTTS language resources: required (the chatterbox voice). Sizes
          # are checked against partitions.csv so a too-small slot fails here,
          # not on the device ("wrong partition size").
          TA_FILE=$(find firmware/build -name picotts_ta.bin -print -quit || true)
          SG_FILE=$(find firmware/build -name picotts_sg.bin -print -quit || true)
          if [ -z "$TA_FILE" ] || [ -z "$SG_FILE" ]; then
            echo "::error::PicoTTS picotts_ta.bin / picotts_sg.bin not produced by the build"; exit 1
          fi
          cp "$TA_FILE" dist/picotts_ta.bin
          cp "$SG_FILE" dist/picotts_sg.bin
          python3 - <<'PY2'
          import csv, os
          parts={r[0].strip():int(r[4],16) for r in csv.reader(open('firmware/partitions.csv')) if r and not r[0].startswith('#') and len(r)>4}
          for name in ('picotts_ta','picotts_sg'):
              n=os.path.getsize(f'dist/{name}.bin')
              assert n<=parts[name], f'{name}.bin ({n}) exceeds its partition ({parts[name]})'
              print(name,'bytes',n,'partition',parts[name])
          PY2
          PICO_PRESENT=1
          # The speech model must contain an English MultiNet (mn7_en), or the
          # fox cannot recognise commands. srmodels.bin embeds model dir names.
          grep -a -q "mn7_en" dist/srmodels.bin || { echo "::error::srmodels.bin has no mn7_en English MultiNet — check CONFIG_SR_MN_EN_* in sdkconfig.defaults"; exit 1; }
          echo "srmodels contains mn7_en: OK"
          cd dist
          sha256sum * > SHA256SUMS
          gen() {
            local brain="$1" out="$2"
            python3 - "$brain" "$out" "$APP_OFFSET" "$MODEL_OFFSET" "$FOXBRAIN_OFFSET" "$PICO_TA_OFFSET" "$PICO_SG_OFFSET" "$PICO_PRESENT" <<'PY'
          import json, os, sys
          brain,out,app,model,broff,ta,sg,pico=sys.argv[1:]
          parts=[
            {"path":"bootloader.bin","offset":0},
            {"path":"partition-table.bin","offset":32768},
            {"path":"fox.bin","offset":int(app)},
            {"path":"srmodels.bin","offset":int(model)},
            {"path":brain,"offset":int(broff)},
          ]
          if pico == "1":
              parts += [{"path":"picotts_ta.bin","offset":int(ta)},
                        {"path":"picotts_sg.bin","offset":int(sg)}]
          with open(out,"w") as f:
              json.dump({"name":"Fox Voice Companion","version":"1.0.1","new_install_prompt_erase":True,
                         "builds":[{"chipFamily":"ESP32-S3","parts":parts}]},f,separators=(',',':'))
          PY
          }
          gen foxbrainA.bin manifest.json
          gen foxbrainB.bin manifest-b.json
      - uses: actions/upload-artifact@v4
        with:
          name: fox-firmware
          path: dist/
      - name: Publish to Pages (web flasher + firmware)
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p site; cp -r web/* site/; cp -r dist site/firmware; touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  deploy-pages:
    if: github.ref == 'refs/heads/main'
    needs: firmware
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
